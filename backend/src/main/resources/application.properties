spring.application.name=smart-campus-service
server.port=${PORT:8080}

# Cloud-friendly default database. Set SPRING_DATASOURCE_* variables in production
# if you want to replace H2 with a managed MySQL/PostgreSQL database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./smart_campus_db;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
