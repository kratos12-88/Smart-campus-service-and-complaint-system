<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="Smart Campus Service & Complaint Management System — report, track and resolve campus maintenance, ICT, security and facility issues."/>
  <meta name="theme-color" content="#fffdf8"/>
  <title>Smart Campus | Service & Complaint Management</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f0e8}
    #smart-campus-splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#fffdf8;color:#1f2925;overflow:hidden;transition:opacity .5s ease,visibility .5s ease}
    #smart-campus-splash.splash-exit{opacity:0;visibility:hidden;pointer-events:none}
    .splash-inner{width:min(520px,84vw);display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(8px);animation:splashEnter .7s cubic-bezier(.22,1,.36,1) forwards}
    .splash-mark-wrap{width:96px;height:96px;display:grid;place-items:center;position:relative;margin-bottom:22px}
    .splash-mark-wrap:before{content:"";position:absolute;inset:0;border:1px solid #d8d1c4;transform:scale(.72);opacity:0;animation:frameIn .6s .12s ease forwards}
    .splash-mark{width:74px;height:74px;display:block;opacity:0;transform:scale(.72) translateY(8px);animation:markIn .7s .18s cubic-bezier(.22,1,.36,1) forwards}
    .splash-name{font-family:Inter,Arial,sans-serif;font-size:clamp(1.55rem,4vw,2.25rem);font-weight:800;letter-spacing:-.045em;margin:0;color:#1f2925;opacity:0;transform:translateY(12px);animation:textIn .6s .38s ease forwards}
    .splash-subtitle{font-family:Inter,Arial,sans-serif;font-size:.77rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6b6a63;margin-top:8px;opacity:0;transform:translateY(10px);animation:textIn .55s .5s ease forwards}
    .splash-loader{width:180px;height:3px;background:#ded8cc;margin-top:30px;overflow:hidden;opacity:0;animation:loaderShow .25s .65s forwards}
    .splash-loader span{display:block;width:38%;height:100%;background:#24513f;transform:translateX(-115%);animation:loaderMove 1.05s .7s cubic-bezier(.65,0,.35,1) infinite}
    .splash-status{font-family:Inter,Arial,sans-serif;margin-top:12px;font-size:.74rem;color:#8a877f;letter-spacing:.04em;opacity:0;animation:loaderShow .3s .78s forwards}
    .splash-corner{position:absolute;width:28px;height:28px;border-color:#d8d1c4;border-style:solid;opacity:0;animation:cornerIn .45s .25s forwards}
    .splash-corner.tl{top:28px;left:28px;border-width:1px 0 0 1px}.splash-corner.tr{top:28px;right:28px;border-width:1px 1px 0 0}.splash-corner.bl{bottom:28px;left:28px;border-width:0 0 1px 1px}.splash-corner.br{bottom:28px;right:28px;border-width:0 1px 1px 0}
    @keyframes splashEnter{to{transform:translateY(0)}}
    @keyframes markIn{to{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes frameIn{to{opacity:1;transform:scale(1)}}
    @keyframes textIn{to{opacity:1;transform:translateY(0)}}
    @keyframes loaderShow{to{opacity:1}}
    @keyframes loaderMove{0%{transform:translateX(-115%)}55%{transform:translateX(135%)}100%{transform:translateX(380%)}}
    @keyframes cornerIn{to{opacity:1}}
    @media(max-width:560px){.splash-mark-wrap{width:82px;height:82px}.splash-mark{width:64px;height:64px}.splash-loader{width:150px}.splash-corner{display:none}}
    @media(prefers-reduced-motion:reduce){.splash-inner,.splash-mark,.splash-mark-wrap:before,.splash-name,.splash-subtitle,.splash-loader,.splash-status,.splash-corner,.splash-loader span{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
</head>
<body>
  <div id="smart-campus-splash" aria-label="Loading Smart Campus">
    <i class="splash-corner tl"></i><i class="splash-corner tr"></i><i class="splash-corner bl"></i><i class="splash-corner br"></i>
    <div class="splash-inner">
      <div class="splash-mark-wrap"><img class="splash-mark" src="/logo-mark.svg" alt="Smart Campus logo"/></div>
      <h1 class="splash-name">Smart Campus</h1>
      <div class="splash-subtitle">Service &amp; Complaint Management</div>
      <div class="splash-loader" aria-hidden="true"><span></span></div>
      <div class="splash-status">Preparing campus services</div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    (function(){
      var splash=document.getElementById('smart-campus-splash');
      if(!splash)return;
      var started=Date.now();
      function dismiss(){
        var elapsed=Date.now()-started;
        var wait=Math.max(0,1450-elapsed);
        setTimeout(function(){
          splash.classList.add('splash-exit');
          setTimeout(function(){if(splash&&splash.parentNode)splash.parentNode.removeChild(splash)},550);
        },wait);
      }
      if(document.readyState==='complete'){dismiss()}else{window.addEventListener('load',dismiss,{once:true});setTimeout(dismiss,3200)}
    })();
  </script>
</body>
</html>
